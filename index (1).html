<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Isaiah Contreras | Electrical Engineering Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#12070a;--panel:#1e0d12;--line:#4a1f29;--text:#efe4e1;--dim:#b49da0;--gold:#d4b25a;--trace:#e08a96}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:linear-gradient(180deg,#230a0f 0,var(--bg) 420px) var(--bg);color:var(--text);font:400 16px/1.6 "IBM Plex Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Space Grotesk",system-ui,sans-serif;margin:0;line-height:1.15}
a{color:var(--gold)}
a:focus-visible,button:focus-visible{outline:2px solid var(--trace);outline-offset:3px}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
nav{display:flex;gap:20px;flex-wrap:wrap;padding:18px 0;font-size:.95rem}
nav a{color:var(--dim);text-decoration:none}nav a:hover{color:var(--text)}
.hero{padding:48px 0 56px;border-bottom:1px solid var(--line)}
.hero h1{font-size:clamp(2.4rem,7vw,4.2rem);font-weight:700;letter-spacing:-.02em}
.role{font-family:"Space Grotesk",sans-serif;font-size:clamp(1.05rem,2.6vw,1.35rem);color:var(--gold);margin:14px 0 18px}
.hero p{max-width:62ch;color:var(--dim);margin:0 0 24px}
.scope{width:100%;height:auto;margin:6px 0 26px;display:block;max-width:100%;background:#03110a;border:1px solid #2a3a30;border-radius:10px;box-shadow:0 0 0 5px #0d0709,0 0 28px rgba(77,255,154,.10)}
.scope path{fill:none;stroke-linejoin:round}
.scope .grid path{stroke:#15402a;stroke-width:1}
.scope .grid path.mid{stroke:#1f6b43;stroke-width:1.3;stroke-dasharray:2 6}
.scope path.sig{stroke:#4dff9a;stroke-width:2.2;filter:drop-shadow(0 0 3px #4dff9a) drop-shadow(0 0 8px rgba(77,255,154,.5))}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;padding:10px 18px;border:1px solid var(--gold);border-radius:6px;text-decoration:none;font-weight:500}
.btn.solid{background:var(--gold);color:#1a1405}
.btn:hover{filter:brightness(1.12)}
section{padding:52px 0;border-bottom:1px solid var(--line)}
h2{font-size:1.7rem;margin-bottom:26px}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:22px;display:flex;flex-direction:column;gap:10px}
.card h3{font-size:1.2rem}
.meta{color:var(--dim);font-size:.9rem;margin:0}
.card p{margin:0}
.card ul,.job ul{margin:0;padding-left:18px;color:var(--text)}
.card li,.job li{margin-bottom:6px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.tag{font-size:.8rem;padding:2px 9px;border:1px solid var(--line);border-radius:99px;color:var(--trace)}
.links{display:flex;gap:14px;flex-wrap:wrap;font-size:.95rem}
.job{padding:0 0 26px 22px;border-left:2px solid var(--line);margin-left:4px;position:relative}
.job::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--gold)}
.job h3{font-size:1.15rem}
.job .meta{margin:2px 0 10px}
.skills{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.skills h3{font-size:1rem;color:var(--gold);margin-bottom:8px}
.skills p{margin:0;color:var(--dim)}
footer{padding:36px 0 48px;color:var(--dim);font-size:.9rem}
@media (prefers-reduced-motion:no-preference){.scope path.sig{stroke-dasharray:1600;stroke-dashoffset:1600;animation:draw 2.2s ease-out forwards}}
@keyframes draw{to{stroke-dashoffset:0}}
</style>
</head>
<body>
<div class="wrap">
<nav aria-label="Sections"><a href="#projects">Projects</a><a href="#experience">Experience</a><a href="#skills">Skills</a><a href="#involvement">Involvement</a><a href="#contact">Contact</a></nav>

<header class="hero">
  <h1 id="name"></h1>
  <div class="role" id="role"></div>
  <svg class="scope" viewBox="0 0 900 90" role="img" aria-label="Decorative signal trace">
    <g class="grid"><path d="M0 15H900M0 30H900M0 60H900M0 75H900M90 0V90M180 0V90M270 0V90M360 0V90M540 0V90M630 0V90M720 0V90M810 0V90"/><path class="mid" d="M0 45H900M450 0V90"/></g>
    <path class="sig" d="M0 45H90L110 45 130 15 150 75 170 15 190 75 210 45H330C360 10 390 10 420 45S480 80 510 45H600V15H660V75H720V15H780V45H900"/>
  </svg>
  <p id="summary"></p>
  <div class="btns" id="heroBtns"></div>
</header>

<section id="projects"><h2>Projects</h2><div class="grid" id="projectGrid"></div></section>
<section id="experience"><h2>Experience</h2><div id="expList"></div></section>
<section id="skills"><h2>Skills</h2><div class="skills" id="skillGrid"></div></section>
<section id="involvement"><h2>Leadership and involvement</h2><div id="leadList"></div></section>
<section id="contact"><h2>Contact</h2><p id="contactText"></p><div class="btns" id="contactBtns"></div></section>
<footer id="foot"></footer>
</div>

<script>
/* ============================================================
   EDIT THIS BLOCK ONLY. Everything below it builds the page.
   To add a project: copy one { ... } block in PROJECTS, paste it
   at the top of the list, and change the text.
   ============================================================ */
const PROFILE = {
  name: "Isaiah Contreras",
  role: "Electrical Engineering student, micro/nano devices and operations management",
  summary: "Senior EE student at Texas State University (B.S. expected Fall 2027, minors in Applied Mathematics and Business Management). I combine hands-on semiconductor and embedded systems work with a background running large-scale operations, and I want to help engineering teams ship complex systems.",
  email: "isaiahcontreras115@gmail.com",
  linkedin: "https://www.linkedin.com/in/isaiah-contreras-49a611324",
  github: "https://github.com/isaiah-con",
  // Add your hosted resume PDF address here to turn on the Resume buttons.
  resume: "resume.pdf"
};

const PROJECTS = [
  {
    title: "TOM Optimization and Real-Time Slack Integration",
    meta: "Amazon Transportation Operations Management, AUS2 internship",
    summary: "Designed a retention strategy for yard operations at an 820,000 sq. ft. fulfillment center and prototyped the software to support it.",
    points: [
      "Projected 160,000 recovered labor hours and $6.4M in annual cost avoidance across the network, using public market data, through 11 implementation-ready artifacts.",
      "Built an 11-screen React/TypeScript UI prototype and the data-routing logic for a proposed real-time Slack integration to remove queue-based workflow delays.",
      "Cut Hostler Accept Delay by about 20% in 8 weeks with visual yard signage and Vehicle Trailer Inspection (VTI) cards."
    ],
    tags: ["React", "TypeScript", "Process design", "Data analysis", "AWS QuickSight"],
    links: [{ label: "Read the white paper", url: "" }]   // paste the white paper address in url
  },
  {
    title: "Flight Logger",
    meta: "Bobcat Aerospace subteam, firmware and hardware contributor",
    summary: "An embedded flight data logging system built by a student team.",
    points: [
      "Defined design objectives, hardware tolerances, and software requirements.",
      "Wrote embedded firmware with ESP-IDF and profiled hardware performance.",
      "Set up Git-based version control for the team's repository."
    ],
    tags: ["ESP-IDF", "C/C++", "Embedded", "Git"],
    links: []
  },
  {
    title: "Engineering Sensor Data System",
    meta: "Team project, Numerical and Statistical Analysis via Python",
    summary: "A modular, object-oriented Python application that loads, cleans, and analyzes simulated engineering sensor data.",
    points: [
      "Led data integration and quality control, using Pandas to filter, merge, and check datasets against per-test metadata.",
      "Built a command-line interface with Matplotlib charts for statistical reporting and error handling.",
      "Wrote Jupyter Notebook walkthroughs that test the system's logic."
    ],
    tags: ["Python", "Pandas", "NumPy", "Matplotlib", "Jupyter"],
    links: [{ label: "View code on GitHub", url: "https://github.com/salgado-15/Object-Oriented-EngineeringData-Analysis-System-NumPy-Pandas-5" }]
  }
];

const EXPERIENCE = [
  {
    role: "Transportation Area Manager Intern",
    org: "Amazon Transportation Operations Management (AUS2)",
    place: "Pflugerville, TX",
    points: [
      "Directed daily yard logistics and 50+ Transportation Associates, keeping safety compliance and freight flow steady at one of the largest yards in the Gulf Coast Region.",
      "Delivered the optimization work described under Projects."
    ]
  },
  {
    role: "Workshop Participant, Semiconductor Science and Engineering",
    org: "Texas State University",
    place: "San Marcos, TX",
    points: [
      "Selected through a competitive process for a fully funded workshop on micro and nano device fabrication.",
      "Analyzed Pulsed Laser Deposition (PLD) and sputtering, and observed Hot Filament CVD for diamond growth.",
      "Used SEM, AFM, and XRD to evaluate semiconductor properties in NSF, DoD, and NASA funded facilities.",
      "Earned a Keysight Technologies certification in Power, RF, and Digital testing and met engineers from Intel and Samsung."
    ]
  },
  {
    role: "Scrutineering and Technical Operations Intern",
    org: "GT World Challenge, SRO Motorsports America",
    place: "Circuit of the Americas, Austin, TX",
    points: [
      "Processed telemetry from scrutineering dataloggers and on-board video to verify compliance and review on-track incidents.",
      "Used laser ride height instruments and handheld scanners to check vehicles against database specifications.",
      "Ran Parc Fermé operations, including post-session teardowns and fuel pump-out procedures."
    ]
  },
  {
    role: "Production Associate, Battery Array and Pack",
    org: "Tesla Gigafactory Texas",
    place: "Austin, TX",
    points: [
      "Worked on Model Y production, then moved to the initial Cybertruck launch.",
      "Troubleshot and repaired structural battery pack and array assemblies, clearing line bottlenecks on both platforms.",
      "Served as a certified workstation trainer, leading small teams alongside engineering, quality, and production leadership."
    ]
  }
];

const SKILLS = [
  { group: "Software and programming", items: "Python (Pandas, NumPy, Matplotlib), C++, MATLAB, React/TypeScript, Jupyter Lab, ESP-IDF, SolidWorks, Git/GitHub, Visual Studio Code" },
  { group: "Hardware and embedded", items: "Microcontroller firmware, Microchip hardware integration, discrete digital logic (gates, full adders, latches), Arduino, soldering, HMI platforms" },
  { group: "Instrumentation and testing", items: "Keysight Semiconductor Industry-Ready certified, SEM, AFM, XRD, laser ride height systems, multimeter, calipers" },
  { group: "Data and operations", items: "AWS QuickSight, advanced Excel, Yard Management Systems, telemetry acquisition, root cause analysis" }
];

const INVOLVEMENT = [
  {
    role: "Sponsorship Coordinator",
    org: "Texas State University IEEE Student Chapter",
    points: [
      "Lead financial strategy and corporate outreach to grow the chapter's operating budget for workshops and student projects.",
      "Pitch tiered sponsorship packages covering funding, equipment donations, and industry networking events."
    ]
  },
  {
    role: "Active member",
    org: "IEEE Robotics and Automation Society, IEEE Computer Society",
    points: ["Attend technical showcases and hardware systems discussions linking computing theory to embedded applications."]
  }
];

const RELEVANT_COURSEWORK = "Circuits I, Digital Logic, Numerical and Statistical Analysis via Python, Engineering Economic Analysis, Foundations of Computer Science I";
/* ===================== END OF EDIT BLOCK ===================== */

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = id => document.getElementById(id);
const list = (a, cls) => a.length ? `<ul${cls ? ` class="${cls}"` : ""}>${a.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "";

$("name").textContent = PROFILE.name;
$("role").textContent = PROFILE.role;
$("summary").textContent = PROFILE.summary;

const resumeBtn = PROFILE.resume ? `<a class="btn solid" href="${esc(PROFILE.resume)}" target="_blank" rel="noopener">Download resume</a>` : "";
$("heroBtns").innerHTML = resumeBtn + `<a class="btn ${resumeBtn ? "" : "solid"}" href="#contact">Get in touch</a><a class="btn" href="${esc(PROFILE.github)}" target="_blank" rel="noopener">GitHub</a>`;

$("projectGrid").innerHTML = PROJECTS.map(p => {
  const links = p.links.filter(l => l.url).map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("");
  return `<article class="card"><h3>${esc(p.title)}</h3><p class="meta">${esc(p.meta)}</p><p>${esc(p.summary)}</p>${list(p.points)}<div class="tags">${p.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>${links ? `<div class="links">${links}</div>` : ""}</article>`;
}).join("");

$("expList").innerHTML = EXPERIENCE.map(j => `<div class="job"><h3>${esc(j.role)}</h3><p class="meta">${esc(j.org)}, ${esc(j.place)}</p>${list(j.points)}</div>`).join("");

$("skillGrid").innerHTML = SKILLS.map(s => `<div><h3>${esc(s.group)}</h3><p>${esc(s.items)}</p></div>`).join("")
  + `<div><h3>Relevant coursework</h3><p>${esc(RELEVANT_COURSEWORK)}</p></div>`;

$("leadList").innerHTML = INVOLVEMENT.map(j => `<div class="job"><h3>${esc(j.role)}</h3><p class="meta">${esc(j.org)}</p>${list(j.points)}</div>`).join("");

$("contactText").textContent = "I'm looking for electrical engineering internships, co-ops, and new grad roles in semiconductors, embedded systems, and technical program management.";
$("contactBtns").innerHTML = `<a class="btn solid" href="mailto:${esc(PROFILE.email)}">Email me</a><a class="btn" href="${esc(PROFILE.linkedin)}" target="_blank" rel="noopener">LinkedIn</a>` + (PROFILE.resume ? `<a class="btn" href="${esc(PROFILE.resume)}" target="_blank" rel="noopener">Resume</a>` : "");
$("foot").textContent = "Isaiah Contreras, San Marcos, TX";
</script>
</body>
</html>
